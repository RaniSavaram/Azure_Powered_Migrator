<header class="harness-header">
  <div class="header-left">
    <button class="sidebar-toggle-btn" (click)="toggleSidebar()" title="Toggle Sidebar" aria-label="Toggle Navigation Sidebar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="9" y1="3" x2="9" y2="21"></line>
      </svg>
    </button>

    <div class="brand-container" routerLink="/">
      <!-- Official Apexon Emblem Image matching user image -->
      <img src="assets/logo/Apexon_emblem.png" alt="Apexon" class="brand-emblem-img">

      <span class="brand-name">Apexon</span>
      <span class="beta-badge">BETA</span>
    </div>
  </div>

  <div class="header-right">
    <!-- Pipeline Status & Execution Indicator -->
    @if (pipelineState$ | async; as state) {
      <div class="pipeline-status-badge" [ngClass]="state">
        @if (state === 'running') {
          <span class="status-radar-pulse"></span>
          <span class="status-msg">
            Pipeline Active · <strong>Phase Running</strong>
          </span>
        } @else if (state === 'completed') {
          <span class="status-check-icon"><i class="bi bi-check-circle-fill"></i></span>
          <span class="status-msg">Pipeline Completed</span>
        } @else {
          <span class="status-dot-idle"></span>
          <span class="status-msg">Pipeline Ready</span>
        }

        <button class="btn-replay-pipeline" (click)="restartPipeline()" title="Restart Agent Sequential Run">
          <i class="bi bi-arrow-repeat"></i>
        </button>
      </div>
    }
  </div>
</header>
