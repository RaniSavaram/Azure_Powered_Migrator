<header class="harness-header">
  <div class="header-left">
    <button class="sidebar-toggle-btn" (click)="toggleSidebar()" title="Toggle Sidebar" aria-label="Toggle Navigation Sidebar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="9" y1="3" x2="9" y2="21"></line>
      </svg>
    </button>

    <div class="brand-container" routerLink="/">
      <div class="brand-logo-icon">
        <!-- Exact Apexon Emblem SVG in Orange -->
        <svg width="22" height="22" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="48" fill="#F97316"/>
          <!-- Apexon stylized A/diamond geometric paths -->
          <polygon points="50,22 62,38 50,54 38,38" fill="#FFFFFF"/>
          <path d="M 24 74 L 50 38 L 76 74 L 62 74 L 50 56 L 38 74 Z" fill="#FFFFFF"/>
          <polygon points="66,60 76,74 72,74 62,60" fill="#F97316"/>
        </svg>
      </div>

      <span class="brand-name">Apexon</span>
      <span class="beta-badge">BETA</span>
    </div>
  </div>

  <div class="header-right">
    <!-- User requested: 'no need of user login things' - login/logout omitted -->
    <div class="header-status-indicator">
      <span class="status-pulse-dot"></span>
      <span class="status-text">Azure Platform Online</span>
    </div>
  </div>
</header>
